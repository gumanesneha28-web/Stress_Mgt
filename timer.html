<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pomodoro Timer | Student Wellness Hub</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gradient-to-r from-indigo-700 via-blue-600 to-cyan-500 min-h-screen flex justify-center items-center">

<div class="glass p-10 rounded-3xl text-center w-11/12 max-w-lg">

<h1 class="text-4xl font-bold text-white mb-6">
⏱ Pomodoro Timer
</h1>

<p class="text-gray-200 mb-5">
Stay focused for 25 minutes, then take a 5-minute break.
</p>

<div id="timer"
class="text-6xl font-bold text-white mb-8">
25:00
</div>

<div class="flex justify-center gap-4 flex-wrap">

<button onclick="startTimer()" class="btn">
▶ Start
</button>

<button onclick="pauseTimer()" class="btn2">
⏸ Pause
</button>

<button onclick="resetTimer()" class="btn bg-red-500 hover:bg-red-600">
🔄 Reset
</button>

</div>

<div class="mt-8">
<a href="index.html" class="text-white underline">
⬅ Back to Home
</a>
</div>

</div>

<script src="js/timer.js"></script>

</body>
</html>
