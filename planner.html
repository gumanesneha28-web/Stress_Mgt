<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Planner | Student Wellness Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-gradient-to-r from-indigo-700 via-blue-600 to-cyan-500 min-h-screen">

<div class="max-w-3xl mx-auto py-12 px-5">

<div class="glass rounded-3xl p-8">

<h1 class="text-4xl text-white font-bold text-center mb-8">
📅 Study Planner
</h1>

<div class="flex gap-3">

<input
id="taskInput"
type="text"
placeholder="Enter your study task..."
class="flex-1 p-3 rounded-xl outline-none">

<button
onclick="addTask()"
class="btn">
Add
</button>

</div>

<ul
id="taskList"
class="mt-8 space-y-4">
</ul>

<div class="text-center mt-10">

<a
href="index.html"
class="text-white underline">

⬅ Back to Home

</a>

</div>

</div>

</div>

<script src="js/planner.js"></script>

</body>

</html>
