<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Student Wellness Hub</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-gradient-to-r from-indigo-700 via-blue-600 to-cyan-500 min-h-screen flex justify-center items-center">

<div class="glass p-10 rounded-3xl w-11/12 max-w-3xl">

<h1 class="text-4xl font-bold text-white text-center mb-8">
📞 Contact Us
</h1>

<form id="contactForm" class="space-y-5">

<input
type="text"
placeholder="Your Name"
required
class="w-full p-3 rounded-xl outline-none">

<input
type="email"
placeholder="Your Email"
required
class="w-full p-3 rounded-xl outline-none">

<textarea
rows="5"
placeholder="Your Message"
required
class="w-full p-3 rounded-xl outline-none"></textarea>

<button
type="submit"
class="btn w-full">
Send Message
</button>

</form>

<div class="mt-10 text-center text-white">

<p class="mb-2">
📧 Email: support@studentwellnesshub.com
</p>

<p class="mb-2">
📞 Phone: +91 98765 43210
</p>

<p>
📍 Nashik, Maharashtra, India
</p>

</div>

<div class="flex justify-center gap-6 mt-8 text-3xl text-white">

<a href="#"><i class="fab fa-facebook"></i></a>

<a href="#"><i class="fab fa-instagram"></i></a>

<a href="#"><i class="fab fa-linkedin"></i></a>

<a href="#"><i class="fab fa-github"></i></a>

</div>

<div class="text-center mt-10">

<a href="index.html" class="btn inline-block">
🏠 Back to Home
</a>

</div>

</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("✅ Thank you! Your message has been submitted successfully.");
    this.reset();
});
</script>

</body>
</html>
